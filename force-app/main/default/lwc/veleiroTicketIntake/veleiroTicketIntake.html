<template>
    <div class="velly-surface">
        <!-- Branded header with Velly -->
        <div class="velly-header">
            <img src={mascot} alt="Velly" class="velly-mascot" />
            <div class="velly-header-text">
                <h2>Raise a ticket</h2>
                <p class={destinationClass}>{destinationLabel}</p>
            </div>
        </div>
        <div class="velly-accentbar"></div>

        <div class="velly-body">
            <lightning-input
                label="Title"
                required
                data-field="title"
                value={title}
                onchange={handleField}
                placeholder="Short summary of the issue"
            ></lightning-input>

            <lightning-textarea
                class="slds-m-top_x-small"
                label="Description"
                data-field="description"
                value={description}
                onchange={handleField}
                onpaste={handlePaste}
                placeholder="What happened? Paste a screenshot here or attach one below."
            ></lightning-textarea>

            <div class="slds-grid slds-gutters_x-small slds-m-top_x-small">
                <div class="slds-col">
                    <lightning-combobox
                        label="Type"
                        data-field="type"
                        value={type}
                        options={typeOptions}
                        onchange={handleField}
                    ></lightning-combobox>
                </div>
                <div class="slds-col">
                    <lightning-combobox
                        label="Priority"
                        data-field="priority"
                        value={priority}
                        options={priorityOptions}
                        onchange={handleField}
                    ></lightning-combobox>
                </div>
            </div>

            <lightning-input
                class="slds-m-top_x-small"
                type="date"
                label="Due date (optional)"
                data-field="dueDate"
                value={dueDate}
                onchange={handleField}
            ></lightning-input>

            <!-- Modern dropzone -->
            <div class="slds-m-top_small">
                <label class="velly-label">Attachments</label>
                <div
                    class={dropzoneClass}
                    onclick={triggerBrowse}
                    ondragover={onDragOver}
                    ondragleave={onDragLeave}
                    ondrop={onDrop}
                >
                    <lightning-icon icon-name="utility:image" size="small" class="velly-drop-icon"></lightning-icon>
                    <div class="velly-drop-text">
                        Drop a screenshot or <span class="velly-link">browse</span>
                    </div>
                    <div class="velly-drop-hint">…or just paste it into the description</div>
                </div>
                <input type="file" multiple accept="image/*,application/pdf" class="velly-file-hidden" onchange={handleFiles} />

                <template for:each={fileNames} for:item="f">
                    <div key={f.key} class="velly-file-chip">
                        <lightning-icon icon-name="doc:image" size="xx-small"></lightning-icon>
                        <span class="velly-file-name">{f.name}</span>
                        <a data-idx={f.key} onclick={removeFile} class="velly-file-remove">✕</a>
                    </div>
                </template>
            </div>

            <template if:true={hasContext}>
                <div class="velly-context">
                    <lightning-icon icon-name="utility:link" size="xx-small"></lightning-icon>
                    <span class="velly-context-label">Captured from</span>
                    <a href={sourceUrl} target="_blank" class="velly-context-url">{sourceUrl}</a>
                </div>
            </template>

            <div class="slds-m-top_medium velly-actions">
                <lightning-button
                    variant="brand"
                    label="Create ticket"
                    onclick={submit}
                    disabled={submitting}
                    class="velly-brand-btn"
                ></lightning-button>
            </div>
        </div>
    </div>
</template>
