<template>
    <div class="vtp">
        <div class="vtp-head">
            <span class="vtp-count">{countLabel}</span>
            <template if:true={showFilter}>
                <div class="vtp-filter">
                    <lightning-input type="search" variant="label-hidden" label={labels.searchProjects}
                        placeholder={labels.searchProjects} value={query}
                        onchange={handleQuery} oninput={handleQuery}></lightning-input>
                </div>
            </template>
            <lightning-button-icon icon-name="utility:refresh" alternative-text={labels.change}
                title={labels.change} variant="border-filled" onclick={load}
                disabled={busy}></lightning-button-icon>
        </div>

        <template if:true={loading}>
            <div class="vtp-loading"><lightning-spinner size="small" alternative-text="…"></lightning-spinner></div>
        </template>

        <template if:true={error}>
            <div class="vtp-error">{error}</div>
        </template>

        <template if:true={hasRows}>
            <div class="vtp-rows">
                <div class="vtp-row vtp-row-head">
                    <span class="vtp-name">{labels.colProject}</span>
                    <span class="vtp-col">{labels.colSync}</span>
                    <span class="vtp-col">{labels.colCanRaise}</span>
                </div>
                <template for:each={visibleRows} for:item="r">
                    <div key={r.projectId} class="vtp-row">
                        <span class="vtp-name">
                            {r.name}
                            <span class="vtp-sub">{r.status}</span>
                        </span>
                        <span class="vtp-col">
                            <lightning-input type="toggle" variant="label-hidden" label={labels.colSync}
                                message-toggle-active={labels.yes} message-toggle-inactive={labels.no}
                                checked={r.enabled} data-id={r.projectId} data-field="enabled"
                                onchange={handleToggle}></lightning-input>
                        </span>
                        <span class="vtp-col">
                            <lightning-input type="toggle" variant="label-hidden" label={labels.colCanRaise}
                                message-toggle-active={labels.yes} message-toggle-inactive={labels.watchOnly}
                                checked={r.clientCanCreate} data-id={r.projectId} data-field="clientCanCreate"
                                onchange={handleToggle}></lightning-input>
                        </span>
                    </div>
                </template>
                <template if:true={nothingMatches}>
                    <div class="vtp-row vtp-row-empty">{labels.noMatches}</div>
                </template>
            </div>
            <div class="vtp-actions">
                <lightning-button variant="brand" label={labels.save} onclick={handleSave}
                    disabled={busy} class="vtp-brand-btn"></lightning-button>
                <span class="vtp-hint">{labels.pullHint}</span>
            </div>
        </template>

        <template if:false={hasRows}>
            <template if:false={loading}>
                <p class="vtp-empty">{labels.noProjects}</p>
            </template>
        </template>
    </div>
</template>
