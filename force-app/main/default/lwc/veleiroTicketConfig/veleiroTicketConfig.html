<template>
    <div class="vts">
        <header class="vts-head">
            <img src={mascot} alt="Velly" class="vts-mascot" />
            <div class="vts-head-text">
                <h1>{labels.setupTitle}</h1>
                <p>{labels.setupSub}</p>
            </div>
            <template if:true={connected}>
                <span class="vts-env">{setup.environment}</span>
            </template>
        </header>

        <!-- 1 · Conexión -->
        <section class={class1} data-step="1">
            <div class="vts-row" data-step="1" onclick={handleStepClick}>
                <span class="vts-num">1</span>
                <div class="vts-row-text">
                    <h2>{labels.s1}</h2>
                    <p class="vts-summary">{summary1}</p>
                </div>
                <template if:true={step1.done}>
                    <span class="vts-badge">{labels.stepDone}</span>
                </template>
            </div>
            <template if:true={show1}>
                <div class="vts-body">
                    <p class="vts-note">{labels.s1sub}</p>
                    <lightning-combobox
                        label={labels.environment}
                        value={environment}
                        options={envOptions}
                        onchange={handleEnv}></lightning-combobox>
                    <lightning-input
                        class="vts-field"
                        type="password"
                        label={labels.token}
                        value={token}
                        placeholder={tokenPlaceholder}
                        onchange={handleToken}></lightning-input>
                    <div class="vts-actions">
                        <lightning-button variant="brand" label={labels.connect}
                            onclick={saveConnection} disabled={savingConnection}
                            class="vts-brand-btn"></lightning-button>
                    </div>
                </div>
            </template>
        </section>

        <!-- 2 · Cliente -->
        <section class={class2} data-step="2">
            <div class="vts-row" data-step="2" onclick={handleStepClick}>
                <span class="vts-num">2</span>
                <div class="vts-row-text">
                    <h2>{labels.s2}</h2>
                    <p class="vts-summary">{summary2}</p>
                </div>
                <template if:true={step2.done}>
                    <span class="vts-badge">{labels.stepDone}</span>
                </template>
            </div>
            <template if:true={show2}>
                <div class="vts-body">
                    <p class="vts-note">{labels.s2sub}</p>
                    <lightning-input
                        type="search"
                        label={labels.client}
                        placeholder={labels.clientPlaceholder}
                        value={clientQuery}
                        onchange={handleClientQuery}
                        oninput={handleClientQuery}></lightning-input>

                    <template if:true={loadingClients}>
                        <div class="vts-loading">
                            <lightning-spinner size="small" alternative-text="…"></lightning-spinner>
                        </div>
                    </template>

                    <ul class="vts-clients">
                        <template for:each={clientRows} for:item="c">
                            <li key={c.id}>
                                <button type="button" class={c.cls} data-id={c.id} data-name={c.name}
                                    onclick={handlePickClient}>{c.name}</button>
                            </li>
                        </template>
                    </ul>
                    <template if:true={hasMoreClients}>
                        <p class="vts-note">+{moreClients} · {labels.clientPlaceholder}</p>
                    </template>

                    <div class="vts-actions">
                        <lightning-button variant="brand" label={labels.saveClient}
                            onclick={saveClient} disabled={savingClient}
                            class="vts-brand-btn"></lightning-button>
                    </div>
                </div>
            </template>
        </section>

        <!-- 3 · Proyectos -->
        <section class={class3} data-step="3">
            <div class="vts-row" data-step="3" onclick={handleStepClick}>
                <span class="vts-num">3</span>
                <div class="vts-row-text">
                    <h2>{labels.s3}</h2>
                    <p class="vts-summary">{summary3}</p>
                </div>
                <template if:true={step3.done}>
                    <span class="vts-badge">{labels.stepDone}</span>
                </template>
            </div>
            <template if:true={show3}>
                <div class="vts-body vts-body-flush">
                    <c-veleiro-ticket-projects onprojectschanged={handleProjectsChanged}></c-veleiro-ticket-projects>
                </div>
            </template>
        </section>

        <!-- 4 · Sincronización -->
        <section class={class4} data-step="4">
            <div class="vts-row" data-step="4" onclick={handleStepClick}>
                <span class="vts-num">4</span>
                <div class="vts-row-text">
                    <h2>{labels.s4}</h2>
                    <p class="vts-summary">{summary4}</p>
                </div>
                <template if:true={step4.done}>
                    <span class="vts-badge">{labels.stepDone}</span>
                </template>
            </div>
            <template if:true={show4}>
                <div class="vts-body">
                    <p class="vts-note">{labels.s4sub}</p>
                    <lightning-radio-group
                        name="frequency"
                        label={labels.frequency}
                        options={freqOptions}
                        value={frequency}
                        type="radio"
                        onchange={handleFrequency}></lightning-radio-group>
                    <div class="vts-actions">
                        <lightning-button variant="brand" label={labels.save}
                            onclick={saveSchedule} disabled={busy4}
                            class="vts-brand-btn"></lightning-button>
                        <lightning-button label={labels.pullNow}
                            onclick={handlePullNow} disabled={busy4}></lightning-button>
                    </div>
                </div>
            </template>
        </section>
    </div>
</template>
