<template>
    <lightning-card>
        <div slot="title" class="velly-card-title">
            <img src={mascot} alt="Velly" class="velly-mascot-sm" />
            <span>Ticket Intake Setup</span>
        </div>
        <div class="velly-accentbar"></div>
        <div class="slds-p-horizontal_medium slds-p-bottom_medium slds-p-top_x-small">
            <!-- ===================== Connection ===================== -->
            <div class="slds-text-title_caps slds-text-color_weak slds-m-bottom_xx-small">1 · Connection</div>

            <!-- Connected summary -->
            <template if:false={showConnectionForm}>
                <div class="slds-box slds-box_xx-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    <div class="slds-text-body_regular">
                        <lightning-icon icon-name="utility:success" size="xx-small" variant="success"></lightning-icon>
                        <span class="slds-m-left_xx-small">{connectionSummary}</span>
                    </div>
                    <lightning-button label="Edit" variant="neutral" onclick={editConnection}></lightning-button>
                </div>
            </template>

            <!-- Connect / edit form -->
            <template if:true={showConnectionForm}>
                <div class="slds-box slds-theme_shade">
                    <lightning-combobox
                        label="Veleiro environment"
                        value={environment}
                        options={envOptions}
                        onchange={handleEnv}
                    ></lightning-combobox>

                    <lightning-input
                        class="slds-m-top_x-small"
                        type="password"
                        label="API Token"
                        value={token}
                        onchange={handleToken}
                        placeholder={tokenPlaceholder}
                    ></lightning-input>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                        Needs <code>task:write</code> plus client/project read. Stored in this org only, never in code.
                    </p>

                    <div class="slds-m-top_small">
                        <lightning-button
                            variant="brand"
                            label="Connect"
                            onclick={saveConnection}
                            disabled={savingConnection}
                            class="velly-brand-btn"
                        ></lightning-button>
                        <template if:true={canCancelConnection}>
                            <lightning-button
                                class="slds-m-left_x-small"
                                label="Cancel"
                                onclick={cancelConnection}
                            ></lightning-button>
                        </template>
                    </div>
                </div>
            </template>

            <!-- ===================== Mapping ===================== -->
            <template if:true={showMapping}>
                <div class="slds-text-title_caps slds-text-color_weak slds-m-top_medium slds-m-bottom_xx-small">
                    2 · Ticket destination
                </div>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                    Which Veleiro client and project the tickets raised in this org are filed under.
                </p>

                <lightning-combobox
                    label="Veleiro Client"
                    placeholder="Search clients…"
                    value={selectedClient}
                    options={clientOptions}
                    onchange={handleClient}
                ></lightning-combobox>

                <lightning-combobox
                    class="slds-m-top_x-small"
                    label="Veleiro Project (optional)"
                    placeholder="Pick a client first"
                    value={selectedProject}
                    options={projectOptions}
                    onchange={handleProject}
                ></lightning-combobox>

                <div class="slds-m-top_medium">
                    <lightning-button
                        variant="brand"
                        label="Save destination"
                        onclick={save}
                        disabled={loading}
                        class="velly-brand-btn"
                    ></lightning-button>
                </div>

                <template if:true={loading}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
